name: dbt CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.CI_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.CI_PASSWORD }}
      SNOWFLAKE_SCHEMA: PR_${{ github.event.number }}
    defaults:
      run:
        working-directory: northwind_dbt
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt and linter
        run: pip install dbt-snowflake sqlfluff sqlfluff-templater-dbt

      - name: Install dbt packages
        run: dbt deps

      - name: Lint SQL
        run: sqlfluff lint models --dialect snowflake

      - name: dbt debug
        run: dbt debug --target ci

      - name: Download prod manifest for state comparison
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: cd.yml
          branch: main
          name: prod-manifest
          path: northwind_dbt/prod-manifest
        continue-on-error: true

      - name: Seed (needed for any new/changed seed files)
        run: dbt seed --target ci

      - name: dbt build (slim CI)
        run: |
          if [ -f prod-manifest/manifest.json ]; then
            dbt build --select state:modified+ --defer --state ./prod-manifest --target ci
          else
            echo "No prod manifest found — running full build (expected on first run)."
            dbt build --target ci
          fi