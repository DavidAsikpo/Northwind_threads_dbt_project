name: Cleanup PR Schema

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.CI_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.CI_PASSWORD }}
      SNOWFLAKE_SCHEMA: PR_${{ github.event.number }}
    defaults:
      run:
        working-directory: northwind_dbt
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Drop the PR's CI schema
        run: |
          dbt run-operation drop_pr_schema \
            --args "{schema: PR_${{ github.event.number }}}" \
            --target ci