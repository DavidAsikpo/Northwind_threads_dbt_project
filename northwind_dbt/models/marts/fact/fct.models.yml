version: 2

models:
  - name: fct_cac
    description: "Monthly aggregated advertising spend, new customer acquisition, and calculated blended CAC per channel."
    config:
      contract:
        enforced: true
    columns:
      - name: channel
        data_type: varchar
        description: "Acquisition marketing channel (e.g., google_ads, meta, organic)."
        constraints:
          - type: not_null

      - name: month_start
        data_type: date
        description: "Truncated start date of the reporting month."
        constraints:
          - type: not_null

      - name: total_spend
        data_type: numeric(16, 2)
        description: "Total marketing spend recorded for the channel within the month."
        constraints:
          - type: not_null

      - name: new_customers
        data_type: integer
        description: "Total count of first-time acquiring customers attributed to this channel."

      - name: cac
        data_type: numeric(16, 2)
        description: "Blended customer acquisition cost (total_spend / new_customers)."

  - name: fct_gross_revenue
    description: "Monthly aggregated Shopify revenue metrics, including discounts, refunds, and net revenue."
    config:
      contract:
        enforced: false
    columns:
      - name: order_month
        data_type: date
        description: "Truncated start date of the order month (primary key)."
        constraints:
          - type: not_null
          - type: primary_key

      - name: gross_revenue
        data_type: numeric(16, 2)
        description: "Total gross order amount before discounts and refunds."

      - name: total_discounts
        data_type: numeric(16, 2)
        description: "Total discount amount applied to orders in the month."

      - name: gross_after_discount
        data_type: numeric(16, 2)
        description: "Gross revenue minus total discounts."

      - name: total_refunds
        data_type: numeric(16, 2)
        description: "Total refunded amounts processed in the month."

      - name: net_revenue
        data_type: numeric(16, 2)
        description: "Final net revenue after applying discounts and deducting refunds."

  - name: fct_ltv
    description: "Total lifetime net revenue attributed to each customer and their initial acquisition channel."
    config:
      contract:
        enforced: true
    columns:
      - name: channel
        data_type: varchar
        description: "First-touch or primary acquisition marketing channel."
        constraints:
          - type: not_null

      - name: customer_id
        data_type: integer
        description: "Unique identifier for the customer (primary key)."
        constraints:
          - type: not_null
          - type: primary_key

      - name: lifetime_revenue
        data_type: numeric(16, 2)
        description: "Cumulative net revenue generated by the customer across all orders."

  - name: fct_mrr_movements
    description: "Monthly snapshot of subscription statuses, intervals, MRR amounts, and active plans."
    config:
      contract:
        enforced: false
    columns:
      - name: month_start
        data_type: date
        description: "Truncated start date of the snapshot month."
        constraints:
          - type: not_null

      - name: subscription_id
        data_type: varchar
        description: "Stripe subscription unique identifier."
        constraints:
          - type: not_null

      - name: customer_id
        data_type: varchar
        description: "Stripe customer identifier associated with the subscription."
        constraints:
          - type: not_null

      - name: shopify_customer_id
        data_type: varchar
        description: "Mapped Shopify customer identifier, if linked."

      - name: billing_interval
        data_type: varchar
        description: "Cadence of recurring billing (e.g., month, year)."

      - name: mrr_amount
        data_type: numeric(16, 2)
        description: "Normalized Monthly Recurring Revenue attributed to this subscription."

      - name: plan_id
        data_type: varchar
        description: "Stripe price/plan identifier active during the invoice period."

  - name: fct_refund_rate_by_product
    description: "Aggregated unit sales, refund instances, and overall refund percentage by product."
    config:
      contract:
        enforced: false 
    columns:
      - name: product_id
        data_type: integer
        description: "Unique identifier for the product (primary key)."
        constraints:
          - type: not_null
          - type: primary_key

      - name: sku
        data_type: varchar
        description: "Stock Keeping Unit code for the product."

      - name: product_name
        data_type: varchar
        description: "Catalog name of the product."

      - name: category
        data_type: varchar
        description: "Product category taxonomy."

      - name: total_lines_sold
        data_type: integer
        description: "Total count of order lines containing this product."
        constraints:
          - type: not_null

      - name: total_units_sold
        data_type: integer
        description: "Total physical units ordered across all lines."

      - name: lines_refunded
        data_type: integer
        description: "Count of order lines where a refund was issued."
        constraints:
          - type: not_null

      - name: units_refunded
        data_type: integer
        description: "Total physical quantity of units refunded."

      - name: total_refunded_amount
        data_type: numeric(16, 2)
        description: "Total monetary value refunded for this product."

      - name: refund_rate_pct
        data_type: numeric(5, 2)
        description: "Percentage of total sold lines that resulted in a refund."
  - name: fct_roas
    description: "Monthly ad spend, attributed net revenue, and calculated ROAS by marketing channel."
    config:
      contract:
        enforced: false
    columns:
      - name: channel
        data_type: varchar
        description: "Attributed marketing channel (e.g., google_ads, meta, tiktok)."
        constraints:
          - type: not_null

      - name: month_start
        data_type: date
        description: "Truncated start date of the reporting month."
        constraints:
          - type: not_null

      - name: total_spend
        data_type: numeric(16, 2)
        description: "Total marketing spend allocated to this channel during the month."
        constraints:
          - type: not_null

      - name: net_revenue
        data_type: numeric(16, 2)
        description: "Net revenue generated by customers attributed to this channel."

      - name: roas
        data_type: numeric(10, 4)
        description: "Return on ad spend calculated as attributed net revenue divided by total spend."